name: Apply Compact Bracket Fix

on: push

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch bracket generation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main.tsx')
          s = path.read_text()

          old_type = "type Fixture={id:number;roundIndex:number;round:string;position:number;player1?:string;player2?:string;score1?:number;score2?:number;winner?:string;dateTime?:string};"
          new_type = "type Fixture={id:number;roundIndex:number;round:string;position:number;player1?:string;player2?:string;pending1?:boolean;pending2?:boolean;score1?:number;score2?:number;winner?:string;dateTime?:string};"
          if old_type not in s:
              raise SystemExit('Fixture type pattern not found')
          s = s.replace(old_type, new_type, 1)

          old_make = "function makeBracket(names:string[]):Fixture[]{const size=nextPowerOfTwo(Math.max(2,names.length));const slots=[...names];while(slots.length<size)slots.push('BYE');const out:Fixture[]=[];for(let r=0;r<Math.log2(size);r++){const count=size/Math.pow(2,r+1);for(let p=0;p<count;p++){const f:Fixture={id:Date.now()+r*10000+p,roundIndex:r,round:roundName(size,r),position:p};if(r===0){f.player1=slots[p*2];f.player2=slots[p*2+1];if(f.player1==='BYE')f.player1=undefined;if(f.player2==='BYE')f.player2=undefined;if(f.player1&&!f.player2)f.winner=f.player1;if(!f.player1&&f.player2)f.winner=f.player2}out.push(f)}}return cascadeByes(out)}"
          new_make = """function makeBracket(names:string[]):Fixture[]{
          const clean=names.map(x=>x.trim()).filter(Boolean);
          const n=clean.length;
          const bracketSize=nextPowerOfTwo(Math.max(2,n));
          const hasPlayIn=n<bracketSize;
          const mainField=hasPlayIn?bracketSize/2:bracketSize;
          const playInCount=hasPlayIn?n-mainField:0;
          const out:Fixture[]=[];
          const stamp=Date.now();
          let roundIndex=0;
          if(playInCount>0){
            for(let p=0;p<playInCount;p++)out.push({id:stamp+p,roundIndex:0,round:'Play-In',position:p,player1:clean[p*2],player2:clean[p*2+1]});
            roundIndex=1;
          }
          const direct=clean.slice(playInCount*2);
          for(let p=0;p<mainField/2;p++){
            const a=p*2,b=a+1;
            const f:Fixture={id:stamp+roundIndex*10000+p,roundIndex,round:roundName(mainField,0),position:p};
            if(a<playInCount)f.pending1=true;else f.player1=direct[a-playInCount];
            if(b<playInCount)f.pending2=true;else f.player2=direct[b-playInCount];
            out.push(f);
          }
          for(let r=1;r<Math.log2(mainField);r++){
            const count=mainField/Math.pow(2,r+1);
            for(let p=0;p<count;p++)out.push({id:stamp+(roundIndex+r)*10000+p,roundIndex:roundIndex+r,round:roundName(mainField,r),position:p});
          }
          return out;
          }"""
          if old_make not in s:
              raise SystemExit('makeBracket pattern not found')
          s = s.replace(old_make, new_make, 1)

          old_save = """ const saveFixture=(id:number,f:Fixture)=>setTournaments(ts=>ts.map(t=>{
          if(t.id!==id)return t;
          const fixtures=t.fixtures.map(x=>x.id===f.id?f:{...x});
          if(f.winner){
           const next=fixtures.find(x=>x.roundIndex===f.roundIndex+1&&x.position===Math.floor(f.position/2));
           if(next){if(f.position%2===0)next.player1=f.winner;else next.player2=f.winner;if(next.player1&&!next.player2&&!next.winner)next.winner=next.player1;if(!next.player1&&next.player2&&!next.winner)next.winner=next.player2;}
          }
          const final=fixtures.find(x=>x.round==='Final');
          return {...t,fixtures,status:final?.winner?'Completed':'Live'};
         }));"""
          new_save = """ const saveFixture=(id:number,f:Fixture)=>setTournaments(ts=>ts.map(t=>{
          if(t.id!==id)return t;
          const fixtures=t.fixtures.map(x=>x.id===f.id?f:{...x});
          if(f.winner){
           const next=fixtures.find(x=>x.roundIndex===f.roundIndex+1&&x.position===Math.floor(f.position/2));
           if(next){if(f.position%2===0){next.player1=f.winner;next.pending1=false}else{next.player2=f.winner;next.pending2=false}}
          }
          const final=fixtures.find(x=>x.round==='Final');
          return {...t,fixtures,status:final?.winner?'Completed':'Live'};
         }));"""
          if old_save not in s:
              raise SystemExit('saveFixture pattern not found')
          s = s.replace(old_save, new_save, 1)

          start = s.index('function BracketMatch(')
          end = s.index('function Reports(', start)
          new_match = """function BracketMatch({fixture,onSave}:{fixture:Fixture;onSave:(f:Fixture)=>void}){const[p1,setP1]=React.useState(String(fixture.score1??''));const[p2,setP2]=React.useState(String(fixture.score2??''));const[editing,setEditing]=React.useState(false);const save=()=>{const a=p1===''?undefined:Number(p1),b=p2===''?undefined:Number(p2);if(a===undefined||b===undefined||a===b)return;const winner=a>b?fixture.player1:fixture.player2;if(!winner)return;onSave({...fixture,score1:a,score2:b,winner});setEditing(false)};const waiting=Boolean(fixture.pending1||fixture.pending2||!fixture.player1||!fixture.player2);const p1Winner=Boolean(fixture.winner&&fixture.player1&&fixture.winner===fixture.player1);const p2Winner=Boolean(fixture.winner&&fixture.player2&&fixture.winner===fixture.player2);return <div className={`bracket-match ${fixture.winner?'won':''} ${waiting?'bye':''}`}><div className=\"match-head\"><span>Game {fixture.position+1}</span><span>{fixture.dateTime?<><Clock3 size={11}/> {fixture.dateTime}</>:''}</span></div><div className={`player-line ${p1Winner?'winner':''}`}><b>{fixture.player1||'TBD'}</b><span>{fixture.score1??''}</span></div><div className={`player-line ${p2Winner?'winner':''}`}><b>{fixture.player2||'TBD'}</b><span>{fixture.score2??''}</span></div>{fixture.winner?<div className=\"winner-line\"><CheckCircle2 size={12}/> {fixture.winner} advances</div>:waiting?<div className=\"winner-line\">WAITING FOR OPPONENT</div>:<button className=\"match-action\" onClick={()=>setEditing(!editing)}>{editing?'Close score entry':'Record score'}</button>}{editing&&!fixture.winner&&<div className=\"score-editor\"><label><span>{fixture.player1||'Player 1'}</span><input type=\"number\" min=\"0\" value={p1} onChange={e=>setP1(e.target.value)} placeholder=\"0\"/></label><span>:</span><label><span>{fixture.player2||'Player 2'}</span><input type=\"number\" min=\"0\" value={p2} onChange={e=>setP2(e.target.value)} placeholder=\"0\"/></label><button className=\"primary-btn\" onClick={save}>Save</button></div>}</div>}
"""
          s = s[:start] + new_match + s[end:]
          path.write_text(s)
          PY

      - name: Commit fixed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: generate compact brackets from participant count"
          git push
